name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore NLCalc2Source\NLCalc2.csproj

      - name: Build
        run: dotnet build NLCalc2Source\NLCalc2.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish NLCalc2Source\NLCalc2.csproj --configuration Release --runtime win-x64 --self-contained true --output publish

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath NumLockCalculator-win-x64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NumLockCalculator-win-x64
          path: NumLockCalculator-win-x64.zip

